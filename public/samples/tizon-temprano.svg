<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3c6146" />
      <stop offset="0.55" stop-color="#203c2c" />
      <stop offset="1" stop-color="#0b1a12" />
    </radialGradient>
    <linearGradient id="leaf" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6fae63" />
      <stop offset="0.45" stop-color="#43834a" />
      <stop offset="1" stop-color="#225c39" />
    </linearGradient>
    <radialGradient id="lesion" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a8663a" />
      <stop offset="0.55" stop-color="#77401f" />
      <stop offset="1" stop-color="#4e2914" />
    </radialGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="leafShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="22" stdDeviation="16" flood-color="#04120c" flood-opacity="0.55" />
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#03100a" stop-opacity="0.72" />
    </radialGradient>
    <path
      id="leaflet"
      d="M0 0C-20-30-58-62-66-108c-6-36 10-64 34-86 6-32 20-58 32-84 12 26 26 52 32 84 24 22 40 50 34 86-8 46-46 78-66 108Z"
    />
    <g id="spot">
