    </g>
    <g transform="translate(410 560) rotate(-48) scale(0.8)">
      <use href="#leaflet" fill="url(#leaf)" />
      <path d="M0 0c-2-64 0-130 0-200M0 152c-20-10-34-26-46-48M0 180c20-10 34-26 46-48" fill="none" stroke="#285f3b" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    </g>
    <g transform="translate(412 472) rotate(70) scale(0.62)">
