      <circle r="30" fill="url(#lesion)" />
      <circle r="30" fill="none" stroke="#3d200f" stroke-width="4" opacity="0.7" />
      <circle r="21" fill="none" stroke="#3d200f" stroke-width="3" opacity="0.65" />
      <circle r="11" fill="none" stroke="#3d200f" stroke-width="3" opacity="0.6" />
      <circle cx="-7" cy="-9" r="3.5" fill="#c9975b" opacity="0.7" />
    </g>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="150" cy="160" r="130" fill="#93c47d" opacity="0.18" filter="url(#blur30)" />
