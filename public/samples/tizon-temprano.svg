      <path d="M410 646c-4-84-2-168 0-256M410 460c-26-14-44-34-58-60M410 500c26-14 44-34 58-60M410 380c-18-10-32-26-42-46M410 410c18-10 32-26 42-46" fill="none" stroke="#285f3b" stroke-width="5" stroke-linecap="round" opacity="0.55" />
