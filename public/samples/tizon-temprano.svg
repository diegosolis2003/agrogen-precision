    </g>
    <g transform="translate(408 356) rotate(24) scale(0.4)">
      <use href="#leaflet" fill="url(#leaf)" />
    </g>
    <g transform="translate(408 356) rotate(-24) scale(0.4)">
      <use href="#leaflet" fill="url(#leaf)" />
    </g>

